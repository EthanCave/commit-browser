# Commit builds should not open Zen's welcome, privacy-policy and what's-new
# pages. surfer's branding step hard-codes those URLs for every brand, so we
# skip the first-run/upgrade page logic instead.
- name: browser.startup.homepage_override.mstone
  value: "ignore"

# The address bar only offers "Switch to tab" for tabs in the current space.
- name: zen.urlbar.switch-to-tab.current-space-only
  value: true

# Pressing Cmd+T while the floating new-tab bar is open keeps it open (and
# selects what was typed) instead of closing it into the sidebar address bar.
- name: zen.urlbar.newtab-shortcut-closes
  value: false

# Per-site style fixes for pages that look broken in Gecko (src/zen/sitefixes).
- name: zen.site-fixes.enabled
  value: true

# The fullscreen notice (restyled as a small pill in zen-single-components.css)
# goes away after 1.5 s instead of 3.
- name: full-screen-api.warning.timeout
  value: 1500

# Focus mode's default blocklist (`focus 25m` in the console). Each site
# also covers its subdomains.
- name: zen.focus.blocklist
  value: "youtube.com, instagram.com, reddit.com, netflix.com, x.com, tiktok.com, twitch.tv, facebook.com"

# Time travel: snapshot every space this often while Commit is open.
- name: zen.git.time-travel.enabled
  value: true

- name: zen.git.time-travel.interval-minutes
  value: 60

# Spotify and Music (the Mac apps) in the sidebar media bar and the console.
- name: zen.media.native-players.enabled
  value: true

# Which app `play` uses when neither is playing: "music", "spotify" or "" (Spotify if installed).
- name: zen.media.native-players.preferred
  value: "music"

# AI features (console: ai, ask, tidy, do, catchup; commit messages).
# Nothing is sent until an API key is added with `ai key`.
# Fast model: commit messages, catch-up, tidy, ai! filters.
- name: zen.ai.model.fast
  value: "claude-haiku-5-5"

# Smart model: ask, do, tidy -s.
- name: zen.ai.model.smart
  value: "claude-sonnet-5-5"

# Local search (ai filters, checkout "<description>") with EmbeddingGemma
# through Ollama, on this Mac. Falls back to Claude when unavailable.
- name: zen.ai.local.enabled
  value: true

- name: zen.ai.local.model
  value: "embeddinggemma"

# `commit` with no -m asks Claude for a message (sends tab titles and URLs).
- name: zen.ai.commit-messages
  value: true

# The catch-up card when you come back to a space after this many hours.
- name: zen.ai.catch-up.enabled
  value: true

- name: zen.ai.catch-up.after-hours
  value: 12

# How much page text `ask` sends at most (about 4 characters per token).
- name: zen.ai.ask.max-chars
  value: 120000

# Where `do` searches: "auto" (Tavily if the tvly CLI is signed in, else
# Claude's web search), "tavily", or "anthropic".
- name: zen.ai.do.search
  value: "auto"

# Updates come from github.com/EthanCave/commit-browser releases. The update
# URL is compiled in by src/build/moz-build.patch; the release notes and
# manual download links are set in ZenUIMigration.sys.mjs, because surfer's
# branding prefs would override them here.

# At startup, check for updates right away when this build is more than 6
# days old. prefs/firefox/browser.yaml sets this only for official builds,
# which Commit isn't, so the check threw on every startup.
- name: app.update.checkInstallTime.days
  value: 6

# Show "Restart to update Commit" in the app menu as soon as an update is
# downloaded, instead of after four days. It installs on the next restart
# either way.
- name: app.update.badgeWaitTime
  value: 0
