# macOS: create and use passkeys with Touch ID even without Apple's passkey
# entitlement (see dom/webauthn/authrs_bridge/src/zen_touchid.rs). Requests
# for a security key still go to USB keys.
- name: zen.passkeys.touchid.enabled
  value: true
