# Arc-style auto-archive (src/zen/archive): loose tabs left unseen for this
# many hours close by themselves and wait in Library › History › Closed tabs.
- name: zen.tabs.auto-archive.enabled
  value: true

- name: zen.tabs.auto-archive.after-hours
  value: 12

# Keep enough closed tabs for the archive to be useful (Firefox keeps 25).
- name: browser.sessionstore.max_tabs_undo
  value: 200
